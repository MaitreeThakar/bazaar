{% extends 'bazaar/base.html' %}

{% block title %}Sign Up | Bazaar{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join Bazaar and start shopping</p>
        </div>

        {% if error %}
        <div class="message error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>

                <input type="text" id="username" name="username" value="{{ username|default:'' }}"
                    placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input type="email" id="email" name="email" value="{{ email|default:'' }}"
                    placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>

                <input type="text" id="phone" name="phone" value="{{ phone|default:'' }}"
                    placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="phone">Role</label>
                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="customer">Customer</option>
                    <option value="supplier">Supplier</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <input type="password" id="confirm_password" name="confirm_password"
                    placeholder="Enter your password again" required>
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
