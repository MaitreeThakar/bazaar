{% extends 'bazaar/base.html' %}

{% block title %}Verify OTP | Bazaar{% endblock %}

{% block content %}

<div class="form-container">
    <div class="form-card">

        <div class="form-header">
            <h1>Verify OTP</h1>
            <p>Enter the OTP sent to your email address.</p>
        </div>

        {% if error %}
        <div class="message error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="otp">OTP</label>
                <input type="text" id="otp" name="otp" placeholder="Enter 4-digit OTP" maxlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Verify OTP
            </button>

        </form>
        <form method="POST" action="{% url 'resend_otp' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary">
                Resend OTP
            </button>
        </form>
        <p>

            <a href="{% url 'login' %}">Back</a>
        </p>


    </div>
</div>

{% endblock %}
