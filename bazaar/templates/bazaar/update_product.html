{% extends 'bazaar/base.html' %}

{% block title %}Update Product | Bazaar{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <div class="form-header">
            <h1>Update Product</h1>
            <p>Update the details of your product.</p>
        </div>

        {% if error %}
        <div class="message error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="name">Product Name</label>

                <input type="text" id="name" name="name" value="{{ product.name }}" placeholder="Enter product name"
                    required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea id="description" name="description" maxlength="300" placeholder="Describe your product"
                    required>{{ product.description }}</textarea>
            </div>
            <div class="form-group"> <label for="price">Price</label>
                <input type="number" id="price" name="price" value="{{ product.price }}"
                    placeholder="Enter product price" min="0.01" step="0.01" required>
            </div>
            <div class="form-actions">

                <a href="{% url 'view_products' %}" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
