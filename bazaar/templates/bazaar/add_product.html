{% extends 'bazaar/base.html' %}

{% block title %}Add Product | Bazaar{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <div class="form-header">
            <h1>Add Product</h1>
            <p>Add a new product to your Bazaar store.</p>
        </div>

        {% if error %}
        <div class="message error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="name">Product Name</label>

                <input type="text" id="name" name="name" value="{{ name|default:'' }}" placeholder="Enter product name"
                    required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea id="description" name="description" placeholder="Describe your product" maxlength="300"
                    required>{{ description|default:'' }}</textarea>
            </div>
            <div class="form-group"> <label for="price">Price</label>
                <input type="number" id="price" name="price" value="{{ price|default:'' }}"
                    placeholder="Enter product price" min="0.01" step="0.01" required>
            </div>
            <div class="form-actions">

                <a href="{% url 'view_products' %}" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Add Product
                </button>

            </div>

        </form>

    </div>


</div>

{% endblock %}
